[project]
name = "agentkit"
version = "0.1.0"
description = "Structured history of agent sessions for a git repo."
requires-python = ">=3.12"
# stdlib only — argparse, sqlite3, json, pathlib.
# 新增執行期依賴須在 commit 訊息寫理由。
dependencies = []

[project.scripts]
agentkit = "agentkit.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 輸出是中文，全形標點是正確寫法，不是可疑字元。
allowed-confusables = ["：", "，", "（", "）", "、", "；", "！", "？"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
