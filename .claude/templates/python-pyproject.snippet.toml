# 併入專案的 pyproject.toml，不要整檔複製（uv init 已產生 [project] 段）。

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# HTTP API 專案才需要。openapi.yaml 是契約 SSoT，models 由它生成、禁手改。
# 生成：uv run datamodel-codegen --input openapi.yaml --output src/<pkg>/models.py
# 漂移檢查：生成後 git diff --exit-code src/<pkg>/models.py
[tool.datamodel-codegen]
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
