[project]
name = "experiment-records"
version = "0.1.0"
description = "驗證 records/experiments/ 的 JSON Schema、project ref 與 Experiment Lifecycle。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
