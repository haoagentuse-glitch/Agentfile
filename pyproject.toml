[project]
name = "agentfile"
version = "0.2.0"
description = "從 core 與 experimental layers 產生可直接複製的 Agentfile 發行包。"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentfile = "agentfile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
